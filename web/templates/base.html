<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Phone first: the capture box has to be usable with one thumb. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Counselog{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="wordmark" href="{{ url_for('home') }}">Counselog</a>
    {% if unlocked %}
      <form method="post" action="{{ url_for('lock') }}" class="inline">
        <input type="hidden" name="{{ csrf_field }}" value="{{ csrf_token }}">
        <button type="submit" class="lock">Lock</button>
      </form>
    {% endif %}
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    {% if unlocked %}
      Unlocked · locks after {{ (unlocked.idle_remaining / 60) | round(0, 'floor') | int }} min idle
    {% else %}
      Locked · notes can still be written
    {% endif %}
  </footer>
</body>
</html>
