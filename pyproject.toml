[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "counselog"
version = "0.1.0"
description = "Encrypted supervisor's note journal with local-LLM bin tagging"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Boss Button Studios" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Security :: Cryptography",
    "Private :: Do Not Upload",
]

# Core runtime. Deliberately small (Law 9). Everything here is needed on BOTH
# machines. Note what is absent: no argon2-cffi (scrypt ships inside
# `cryptography`), and no openssl subprocess (X.509 generation is also
# `cryptography`).
dependencies = [
    "click>=8.1,<9",
    "cryptography>=43,<52",
    "flask>=3.0,<4",
    "httpx>=0.27,<1.0",
    "sqlcipher3>=0.6.2,<0.7",
]

[project.optional-dependencies]
# Laptop only. The desktop never touches a YubiKey — it receives the DEK over
# mTLS — so keeping this out of the core install spares the desktop the whole
# smartcard toolchain.
#
# Why this is an extra and not a core dependency: yubikey-manager pulls in
# pyscard, which publishes NO Linux wheels at all (macOS and Windows only, per
# PyPI as of 2026-08). On Linux it always builds from sdist and needs swig,
# libpcsclite-dev and a C compiler. That cost belongs on the one machine that
# actually has a key plugged into it.
#
#   Debian/Ubuntu laptop prerequisite:
#     sudo apt install swig libpcsclite-dev pcscd
#
# Phase 1 (OTP challenge-response) talks HID and does not need pyscard.
# Phase 7 (PIV signing) needs a SmartCardConnection, so it does.
yubikey = ["yubikey-manager>=5.9,<6"]

dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
counselog = "laptop.cli:cli"

[tool.setuptools]
packages = ["core", "core.crypto", "laptop", "laptop.web", "desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
